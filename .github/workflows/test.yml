name: Test

# On every pull request: typecheck and run the server tests against a throwaway local D1 (no secrets needed).
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm test
      - run: npm run build # runs tsc --noEmit for the client, then vite build
