name: Deploy

# On every merge to main: typecheck, apply pending D1 migrations to production, then deploy Pages (site + API).
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit + D1:Edit) and CLOUDFLARE_ACCOUNT_ID.
# If the Pages project is also connected to GitHub in the Cloudflare dashboard, disconnect it or every merge deploys twice.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run build # runs tsc --noEmit for the client, then vite build
      - name: Apply D1 migrations (production)
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
