name = "hanzi-rush"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "hanzi-rush"
database_id = "31ef87fe-56a1-4626-95b3-fa44e436f375"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# Sign-in (POST /auth/:provider, server/oidc.ts). Unset = that provider is off. See README "Sign-in".
GOOGLE_CLIENT_IDS = "835044888289-f1gfmbisadve711vbog0asa0euf29mjn.apps.googleusercontent.com"
# APPLE_CLIENT_IDS = "<web Services ID>"

# Preview deployments get their own DB so branch testing never touches prod data
[[env.preview.d1_databases]]
binding = "DB"
database_name = "hanzi-rush-preview"
database_id = "25969929-12ce-4ef2-8bb2-29100ef3156c"
migrations_dir = "migrations"

[env.preview.vars]
GOOGLE_CLIENT_IDS = "835044888289-f1gfmbisadve711vbog0asa0euf29mjn.apps.googleusercontent.com"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Secrets: IP_SALT. Prod: `npx wrangler pages secret put IP_SALT`. Local: put IP_SALT=dev in .dev.vars (git-ignored).
