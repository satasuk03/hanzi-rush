name = "hanzi-rush"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "hanzi-rush"
# Placeholder. After `npx wrangler d1 create hanzi-rush`, paste the printed database_id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "capacitor://localhost,https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"

# Preview deployments get their own DB so branch testing never touches prod data
[[env.preview.d1_databases]]
binding = "DB"
database_name = "hanzi-rush-preview"
# Placeholder. After `npx wrangler d1 create hanzi-rush-preview`, paste the printed database_id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.preview.vars]
ALLOWED_ORIGINS = "capacitor://localhost,https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"

# Secret: IP_SALT. Prod: `npx wrangler pages secret put IP_SALT`. Local: put IP_SALT=dev in .dev.vars (git-ignored).
