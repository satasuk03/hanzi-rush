<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".85">
      <stop offset="0" stop-color="#f4effa"/>
      <stop offset="1" stop-color="#b4adc0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset=".5" stop-color="#f4c542"/>
      <stop offset="1" stop-color="#b47a1c"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <ellipse cx="128" cy="228" rx="70" ry="10" fill="#2a1a3a" opacity=".25"/>
  <!-- horns -->
  <g fill="#fff0c8" stroke="#2a1a3a" stroke-width="6" stroke-linejoin="round">
    <path d="M80 90q-34-6-40-44q30 0 52 26z"/>
    <path d="M176 90q34-6 40-44q-30 0-52 26z"/>
  </g>
  <!-- ears -->
  <g stroke="#2a1a3a" stroke-width="7">
    <ellipse cx="44" cy="124" rx="28" ry="16" transform="rotate(20 44 124)" fill="#8a5a38"/>
    <ellipse cx="212" cy="124" rx="28" ry="16" transform="rotate(-20 212 124)" fill="#8a5a38"/>
  </g>
  <ellipse cx="48" cy="126" rx="14" ry="7" transform="rotate(20 48 126)" fill="#ff9fb0"/>
  <ellipse cx="208" cy="126" rx="14" ry="7" transform="rotate(-20 208 126)" fill="#ff9fb0"/>
  <!-- head -->
  <ellipse cx="128" cy="144" rx="74" ry="66" fill="#8a5a38" stroke="#2a1a3a" stroke-width="7"/>
  <ellipse cx="86" cy="106" rx="12" ry="20" transform="rotate(26 86 106)" fill="#fff" opacity=".4"/>
  <path d="M112 84q16 12 32 0" fill="none" stroke="#5e3a20" stroke-width="5" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="128" cy="180" rx="50" ry="32" fill="#ffeccc" stroke="#2a1a3a" stroke-width="5"/>
  <ellipse cx="66" cy="164" rx="13" ry="8" fill="#ff9fb0"/>
  <ellipse cx="190" cy="164" rx="13" ry="8" fill="#ff9fb0"/>
  <!-- eyes -->
  <ellipse cx="94" cy="138" rx="11" ry="15" fill="#2a1a3a"/>
  <circle cx="98" cy="132" r="4.8" fill="#fff"/>
  <ellipse cx="162" cy="138" rx="11" ry="15" fill="#2a1a3a"/>
  <circle cx="166" cy="132" r="4.8" fill="#fff"/>
  <!-- nostrils, ring, mouth -->
  <ellipse cx="112" cy="170" rx="5" ry="6.5" fill="#c98a6a" stroke="#2a1a3a" stroke-width="3"/>
  <ellipse cx="144" cy="170" rx="5" ry="6.5" fill="#c98a6a" stroke="#2a1a3a" stroke-width="3"/>
  <path d="M110 192q18 10 36 0" fill="none" stroke="#2a1a3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M114 180q14 16 28 0" fill="none" stroke="#2a1a3a" stroke-width="9" stroke-linecap="round"/>
  <path d="M114 180q14 16 28 0" fill="none" stroke="#ffd35a" stroke-width="4" stroke-linecap="round"/>
  <!-- seal -->
  <g transform="rotate(-6 180 204)">
    <rect x="162" y="186" width="36" height="36" rx="6" fill="#c3272d" stroke="#2a1a3a" stroke-width="4"/>
    <text x="180" y="214" text-anchor="middle" font-family="Kaiti SC, STKaiti, PingFang SC, serif" font-size="26" font-weight="700" fill="#f7ecdc">牛</text>
  </g>
</svg>
