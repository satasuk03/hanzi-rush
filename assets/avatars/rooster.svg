<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".85">
      <stop offset="0" stop-color="#f4effa"/>
      <stop offset="1" stop-color="#b4adc0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <ellipse cx="128" cy="228" rx="70" ry="10" fill="#2a1a3a" opacity=".25"/>
  <!-- comb -->
  <g fill="#e8303c" stroke="#2a1a3a" stroke-width="6">
    <circle cx="96" cy="64" r="20"/>
    <circle cx="128" cy="50" r="24"/>
    <circle cx="160" cy="64" r="20"/>
  </g>
  <!-- head -->
  <ellipse cx="128" cy="146" rx="78" ry="68" fill="#fff7ec" stroke="#2a1a3a" stroke-width="7"/>
  <!-- cover comb base -->
  <ellipse cx="128" cy="84" rx="30" ry="12" fill="#e8303c"/>
  <ellipse cx="84" cy="108" rx="12" ry="20" transform="rotate(26 84 108)" fill="#fff" opacity=".8"/>
  <!-- wing tufts on cheeks -->
  <g fill="#ffe3b0" stroke="#2a1a3a" stroke-width="4.5" stroke-linejoin="round">
    <path d="M52 140q-14 14-2 32q16-4 22-20z"/>
    <path d="M204 140q14 14 2 32q-16-4-22-20z"/>
  </g>
  <ellipse cx="82" cy="170" rx="13" ry="8" fill="#ff9fb0"/>
  <ellipse cx="174" cy="170" rx="13" ry="8" fill="#ff9fb0"/>
  <!-- eyes -->
  <ellipse cx="98" cy="136" rx="11" ry="15" fill="#2a1a3a"/>
  <circle cx="102" cy="130" r="4.8" fill="#fff"/>
  <ellipse cx="158" cy="136" rx="11" ry="15" fill="#2a1a3a"/>
  <circle cx="162" cy="130" r="4.8" fill="#fff"/>
  <!-- wattle -->
  <path d="M116 190q12 34 24 0z" fill="#e8303c" stroke="#2a1a3a" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- beak -->
  <path d="M106 158q22-10 44 0q-4 16-22 28q-18-12-22-28z" fill="#ffc83a" stroke="#2a1a3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M112 168q16 6 32 0" fill="none" stroke="#2a1a3a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- seal -->
  <g transform="rotate(-6 180 204)">
    <rect x="162" y="186" width="36" height="36" rx="6" fill="#c3272d" stroke="#2a1a3a" stroke-width="4"/>
    <text x="180" y="214" text-anchor="middle" font-family="Kaiti SC, STKaiti, PingFang SC, serif" font-size="26" font-weight="700" fill="#f7ecdc">鸡</text>
  </g>
</svg>
